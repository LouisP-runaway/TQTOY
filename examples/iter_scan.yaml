# tqtoy configuration: ITER-like thermal quench, scan of the deposited D and Ne densities.
# Parameters not listed here take their default values (see: tqtoy init --template single_run).
# Run with:   tqtoy run iter_scan_input.yaml -j 4
# Map with:   tqtoy init -t map, then set results: results/ITER_0D_Pellet.h5 and run  tqtoy map map_input.yaml

plasma:
  Te0: 20.0e3                 # [eV]
  ne0: 1.0e20                 # [m^-3]
  J: 1.0e6                    # [A m^-2]
  B: 5.3                      # [T]

impurities:
  neon:
    injected_atom_density: 5.0e19  # [m^-3], scanned below
    background_density: 0.0

injection:
  source: prescribed
  t_start: 1.0e-7             # [s]
  duration: 1.0e-5            # [s]
  n_D: 1.0e22                 # [m^-3], scanned below

model:
  populations: 1

time:
  t_end: 1.0e-2               # [s]
  n_output: 500
  spacing: log

solver:
  method: Radau
  rtol: 1.0e-2
  atol: 1.0e-10

output:
  file: results/ITER_0D_Pellet.h5

scan:                         # grid scan; the first axis is the outer loop
  injection.n_D: {logspace: [20, 23, 21]}                      # 1e20 ... 1e23 m^-3, 21 values
  impurities.neon.injected_atom_density: {logspace: [18, 21, 20]}   # 1e18 ... 1e21 m^-3, 20 values
